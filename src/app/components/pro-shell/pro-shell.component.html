<div class="pro-shell">
    <div class="pro-intro">
        <h1>Pro</h1>
        <p>A reimagined shift companion: mixed worklists, live throughput, fatigue-aware breaks, and history across shifts.</p>
    </div>

    <div class="pro-subnav">
        <button [class.active]="view === 'setup'" [disabled]="shiftService.shiftActive" (click)="goTo('setup')">New Shift</button>
        <button [class.active]="view === 'live'" [disabled]="!shiftService.shiftActive" (click)="goTo('live')">Live Shift</button>
        <button [class.active]="view === 'history'" (click)="goTo('history')">History</button>
    </div>

    <div class="pro-body">
        <app-pro-setup *ngIf="view === 'setup'" (shiftStarted)="onShiftStarted()"></app-pro-setup>
        <app-pro-live *ngIf="view === 'live'" (shiftEnded)="onShiftEnded()"></app-pro-live>
        <app-pro-history *ngIf="view === 'history'"></app-pro-history>
    </div>
</div>
